<body>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="index.html"><span class="dot"></span>time tools</a>
      <nav class="navlinks">
        <a href="timezones.html">World clock</a>
        <a href="pomodoro.html">Pomodoro</a>
        <a href="timer.html">Timer</a>
        <a class="active" href="stopwatch.html" aria-current="page">Stopwatch</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Stopwatch</h1>
    <p class="page-sub">
      Centisecond precision that never drifts, with lap tracking and
      fastest/slowest lap highlighting.
    </p>

    <div class="card tool-hero">
      <div class="sub-label">stopwatch</div>
      <div id="swClock" class="big-clock">00:00.00</div>

      <div class="controls">
        <button id="startBtn" class="btn btn-primary" type="button">Start</button>
        <button id="lapBtn" class="btn" type="button" disabled>Lap</button>
        <button id="resetBtn" class="btn" type="button" disabled>Reset</button>
      </div>

      <div id="laps" class="laps" hidden></div>
    </div>

    <p class="kbd-hint"><kbd>Space</kbd> start / stop &nbsp;·&nbsp; <kbd>L</kbd> lap &nbsp;·&nbsp; <kbd>R</kbd> reset</p>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/stopwatch.js"></script>
