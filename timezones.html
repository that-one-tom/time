<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time zone converter and world clock — time tools</title>
  <meta name="description" content="Convert times between cities and check the current time around the world. Line up a meeting across time zones by sliding one clock, then share the link.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ccircle%20cx='50'%20cy='50'%20r='44'%20fill='%231c1208'%20stroke='%23ff8c42'%20stroke-width='8'/%3E%3Cline%20x1='50'%20y1='52'%20x2='50'%20y2='30'%20stroke='%23ff8c42'%20stroke-width='7'%20stroke-linecap='round'%20transform='rotate(45%2050%2052)'/%3E%3Cline%20x1='50'%20y1='52'%20x2='50'%20y2='24'%20stroke='%23ff8c42'%20stroke-width='7'%20stroke-linecap='round'%20transform='rotate(210%2050%2052)'/%3E%3Ccircle%20cx='50'%20cy='52'%20r='5'%20fill='%23ff8c42'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topnav">
    <div class="topnav-inner">
      <a class="brand" href="index.html"><span class="dot"></span>time tools</a>
      <nav class="navlinks">
        <a class="active" href="timezones.html" aria-current="page">World clock</a>
        <a href="pomodoro.html">Pomodoro</a>
        <a href="timer.html">Timer</a>
        <a href="stopwatch.html">Stopwatch</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Time zone converter &amp; world clock</h1>
    <p class="page-sub">
      Check the current time in cities around the world. Slide any clock's
      scrubber to move them all together and line up a meeting across
      zones — then share the board as a link.
    </p>

    <div class="tz-toolbar">
      <button id="liveChip" class="chip chip-good" type="button" title=""></button>
      <button id="shareBtn" class="btn" type="button" title="Copy a link to this board">🔗 Share link</button>
    </div>

    <div class="tz-add">
      <input id="addInput" type="text" autocomplete="off" spellcheck="false"
             placeholder='Add a city or time zone — try "Tokyo", "Berlin" or "America/Chicago"…'>
      <div id="addResults" class="tz-results" hidden></div>
    </div>

    <div id="board" class="board"></div>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/tz-logic.js"></script>
  <script src="assets/timezones.js"></script>
</body>
</html>
